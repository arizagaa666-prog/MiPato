<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posa posa posa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,500&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fc4;--violet:#b99bff;--white:#fff4fb;color-scheme:dark}
html,body{margin:0;height:100%;background:#05061a;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-weight:700;color:var(--white)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:88vw;box-sizing:border-box;text-align:center;font-weight:700;font-size:clamp(1.15rem,4.8vw,2rem);letter-spacing:.04em;color:var(--pink);padding:.55em 1.3em;border-radius:999px;background:rgba(8,5,32,.85);border:1px solid rgba(255,150,210,.4);box-shadow:0 0 28px rgba(255,100,190,.35),0 6px 24px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-shadow:0 0 14px rgba(255,120,190,.7);opacity:0;transition:opacity 2s;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);text-align:center;font-style:normal;font-weight:700;letter-spacing:.22em;font-size:.8rem;text-transform:uppercase;color:#e9dcff;text-shadow:0 0 12px rgba(185,155,255,.8);opacity:0;transition:opacity 1.2s;pointer-events:none}
#hint.on{opacity:.85;animation:pu 2.6s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
button{font:inherit;color:inherit;cursor:pointer}
#msg{position:fixed;left:50%;top:33%;transform:translateX(-50%);width:min(88vw,800px);text-align:center;pointer-events:none}
.footer-note{position:fixed;left:calc(env(safe-area-inset-left,0px) + 2.2vh);bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);font-weight:700;font-size:clamp(.55rem,1.1vw,.8rem);letter-spacing:.08em;line-height:1.5;color:var(--pink);text-shadow:0 0 20px rgba(255,100,180,.8),0 2px 12px #000;text-align:left;pointer-events:none;z-index:3;opacity:0;filter:blur(8px);transition:opacity .4s,filter .4s}
.l1{margin:0;font-style:normal;font-weight:700;font-size:clamp(1.05rem,3.8vw,1.9rem);line-height:1.45;text-shadow:0 0 24px rgba(255,150,210,.65),0 2px 16px #000}
.w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(14px);transition:opacity .4s,filter .4s,transform .4s;margin:0 .13em}
.l2{margin:1.3em 0 0;font-weight:700;font-size:clamp(.75rem,2.6vw,1.2rem);letter-spacing:.08em;line-height:1.5;color:var(--pink);text-shadow:0 0 20px rgba(255,100,180,.8),0 2px 12px #000;opacity:0;filter:blur(8px);transition:opacity .4s,filter .4s}
i{font-style:normal;display:inline-block;animation:hb 1.6s ease-in-out infinite}
@keyframes hb{50%{transform:scale(1.3)}}
#msg.show .w{opacity:1;filter:none;transform:none;transition:opacity 1.8s calc(var(--i)*.25s),filter 1.8s calc(var(--i)*.25s),transform 1.8s calc(var(--i)*.25s)}
#msg.show .l2{opacity:1;filter:none;transition:opacity 3s 5s,filter 3s 5s}
#msg.show ~ .footer-note{opacity:1;filter:none;transition:opacity 3s 7s,filter 3s 7s}
#msg.noanim *{transition:none!important}
#again{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);background:none;border:1px solid rgba(255,170,220,.4);border-radius:30px;padding:.5em 1.4em;font-style:normal;font-weight:700;font-size:.8rem;letter-spacing:.14em;opacity:0;pointer-events:none;transition:opacity 2s;z-index:5}
#again.on{opacity:.8;pointer-events:auto}
</style></head><body>
<canvas id="c"></canvas>
<div id="title">Para el amor de mi vida</div>
<div id="msg"><p class="l1" id="l1"></p><p class="l2">Te amo con todo mi corazón mi vida, mi mundo, mi universo, mi todo, mi pato pato pato<i>♥️</i></p></div>
<div id="hint"></div>
<div class="footer-note">Te juro que te amo como no tienes una idea, TE AMOOOOOOOOOOOO <i>♥️S﹠A</i></div>
<button id="again">volver a empezar</button>

'“Eres la luna que orbita mi mundo, la luz de mis noches y lo más hermoso que le pasó a mi vida”'.split(' ').forEach((t,i)=>{const s=document.createElement('span');s.className='w';s.style.setProperty('--i',i);s.textContent=t;l1.appendChild(s)});

// corazón de palabras
const inHeart=(X,Y)=>{const x=X/400,y=-Y/400+.12,a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0};
for(let j=-40;j<=40;j++){const Y=j*12;for(let X=-480+((j&1)?18:0);X<=480;X+=36){
 if(!inHeart(X,Y))continue;
 const x=X+(R()-.5)*2,y=Y+(R()-.5),h=265+65*cl(1-(Y+456)/904);
 words.push({x,y,r:Math.hypot(x,y),a:Math.atan2(y,x),k:.85+R()*.3,t:R(),
  c1:`hsl(${h} 90% ${70+R()*16}%)`,c2:`hsl(${h} 100% 95%)`})}}
const N=words.length,rmax=Math.max(...words.map(w=>w.r));
[...words].sort((a,b)=>a.r-b.r).forEach((w,i)=>{w.tr=100*Math.sqrt((i+.5)/N);w.ta=w.a+2.2;w.d=.3*w.r/rmax});
for(let i=0;i<9;i++){const a=R()*6.28,r=Math.sqrt(R())*.7;craters.push({x:Math.cos(a)*r,y:Math.sin(a)*r,r:.06+R()*.13})}
{const Rr=rnd(21);
 tex=document.createElement('canvas');tex.width=1024;tex.height=512;let t=tex.getContext('2d');
 let g=t.createLinearGradient(0,0,0,512);g.addColorStop(0,'#16367e');g.addColorStop(.5,'#1d5cc4');g.addColorStop(1,'#16367e');t.fillStyle=g;t.fillRect(0,0,1024,512);
 for(let i=0;i<22;i++){const cx=Rr()*1024,cy=90+Rr()*330;for(let k=0;k<14;k++){const x=cx+(Rr()-.5)*150,y=cy+(Rr()-.5)*90,rr=14+Rr()*34;t.fillStyle=`rgba(${60+Rr()*40|0},${150+Rr()*50|0},${110+Rr()*40|0},.92)`;for(const dx of[-1024,0,1024]){t.beginPath();t.arc(x+dx,y,rr,0,7);t.fill()}}}
 cloud=document.createElement('canvas');cloud.width=1024;cloud.height=512;t=cloud.getContext('2d');t.fillStyle='rgba(255,240,255,.17)';
 for(let i=0;i<80;i++){const x=Rr()*1024,y=40+Rr()*430,w=30+Rr()*90,h=6+Rr()*14;for(const dx of[-1024,0,1024]){t.beginPath();t.ellipse(x+dx,y,w,h,0,0,7);t.fill()}}}
for(let i=0;i<260;i++)stars.push({x:R(),y:R(),r:.6+R()*1.5,ph:R()*6,sp:.6+R()*2});
for(let i=0;i<130;i++)parts.push({x:R(),y:R(),vx:(R()-.5)*.012,vy:-.004-R()*.012,r:.6+R()*1.8,ph:R()*6,c:['255,150,210','190,160,255','255,255,255'][i%3]});

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
 fit=Math.min(W*.9/920,H*.78/900);s0=fit*3.4;Rm=cl(Math.min(W,H)*.11,38,92);s2=Rm/100;
 Re=Math.min(W*.8,H*.5);ecx=W/2;ecy=.62*H+Re;ry=ecy-.17*H;rx=Math.max(W*.42,Re*1.15);
 bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#04051a');bgG.addColorStop(.6,'#0b0724');bgG.addColorStop(1,'#16082e');
 const hw=W/2/fit*1.1,hh=H/2/fit*1.1,r=rnd(55);decoys=[];
 const n=Math.min(1700,hw*hh*4/900|0);
 for(let i=0;i<n;i++){const x=(r()*2-1)*hw,y=(r()*2-1)*hh;if(inHeart(x*.92,y*.92))continue;decoys.push({x,y,k:.8+r()*.5})}
}
addEventListener('resize',resize);resize();

// estado
let T=0,target=0,tm=0,last=performance.now();
const DUR=[0,9,9,5.5];
const hint=document.getElementById('hint'),title=document.getElementById('title'),msg=document.getElementById('msg'),again=document.getElementById('again');
const HT=['toca para comenzar','toca para continuar','toca para continuar',''];
let againTO;
function next(){if(T===target&&target<3){target++;if(ac&&on)ac.resume()}}
function prev(){if(T===target&&target>0)target--}
let py=0;
addEventListener('pointerdown',e=>py=e.clientY);
addEventListener('pointerup',e=>{if(e.target.closest('button'))return;(e.clientY-py>60)?prev():next()});
let wl=0;addEventListener('wheel',e=>{if(Date.now()-wl<1200||Math.abs(e.deltaY)<8)return;wl=Date.now();e.deltaY>0?next():prev()},{passive:true});
addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight',' ','Enter'].includes(e.key))next();if(['ArrowUp','ArrowLeft'].includes(e.key))prev()});
again.onclick=()=>{
 clearTimeout(againTO);
 msg.classList.add('noanim');msg.classList.remove('show');

 shown=false;shoot.length=0;fl.forEach((f,i)=>{f.on=false;f.wait=2+i*6});T=0;target=0;

// astronautas a la deriva
const fl=(window.__AST||[]).map((src,i)=>{const im=new Image();im.src=src;return{im,on:false,wait:2+i*6,k:[1,1,.55][i]||1,t:0,dur:20,sx:0,sy:0,ex:0,ey:0,rot:0,vr:0,base:0,sz:100,ph:0}});
function launch(f){
 const m=Math.min(W,H);f.sz=cl(m*.035,17,33)*f.k*(.85+Math.random()*.3);const pad=f.sz,dir=Math.random()<.5?1:-1,rr=()=>H*(.1+Math.random()*.8);
 if(Math.random()<.6){f.sx=dir>0?-pad:W+pad;f.ex=dir>0?W+pad:-pad;f.sy=rr();f.ey=rr()}
 else{f.sy=dir>0?-pad:H+pad;f.ey=dir>0?H+pad:-pad;f.sx=W*(.1+Math.random()*.8);f.ex=W*(.1+Math.random()*.8)}
 f.dur=14+Math.random()*7;f.t=0;f.rot=Math.random()*6.28;f.base=(.25+Math.random()*.4)*(Math.random()<.5?-1:1);f.vr=f.base;f.ph=Math.random()*6.28;f.on=true}
function flyStep(f,dt){
 const moonUp=T>=1.6;
 if(!f.on){if(!moonUp)return;f.wait-=dt;if(f.wait<=0)launch(f);return}
 f.t+=dt/f.dur;if(f.t>=1){launch(f);return}
 f.vr=f.base;
 f.rot+=f.vr*dt;
 const im=f.im;if(!im.complete||!im.naturalWidth)return;
 const x=f.sx+(f.ex-f.sx)*f.t+Math.sin(tm*.9+f.ph)*f.sz*.07,y=f.sy+(f.ey-f.sy)*f.t+Math.cos(tm*.7+f.ph)*f.sz*.12;
 const w=f.sz,h=w*im.naturalHeight/im.naturalWidth,c=Math.cos(f.rot),n=Math.sin(f.rot);
 ctx.globalAlpha=.6*sm((T-1.6)/.3);ctx.setTransform(DPR*c,DPR*n,-DPR*n,DPR*c,DPR*x,DPR*y);ctx.drawImage(im,-w/2,-h/2,w,h);
 ctx.setTransform(DPR,0,0,DPR,0,0)}

// dibujo
function moon(x,y,r,a){
 ctx.globalCompositeOperation='lighter';
 let g=ctx.createRadialGradient(x,y,r*.8,x,y,r*3.4);g.addColorStop(0,`rgba(215,185,255,${.4*a})`);g.addColorStop(.35,`rgba(190,120,255,${.14*a})`);g.addColorStop(1,'rgba(120,80,255,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.4,0,7);ctx.fill();
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a;
 g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#fffaf6');g.addColorStop(.6,'#e9dffc');g.addColorStop(1,'#b49ae0');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 ctx.save();ctx.clip();ctx.fillStyle='rgba(120,100,175,.2)';
 for(const c of craters){ctx.beginPath();ctx.arc(x+c.x*r,y+c.y*r,c.r*r,0,7);ctx.fill()}
 g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(.35,'rgba(10,5,40,0)');g.addColorStop(1,'rgba(10,5,50,.38)');
 ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();
 let fontSize=r*.44;ctx.font=`700 ${fontSize}px Montserrat,Arial,sans-serif`;ctx.textAlign='left';
 let sMetrics=ctx.measureText('S'),aMetrics=ctx.measureText('A');
 const bounds=metrics=>({
  left:Number.isFinite(metrics.actualBoundingBoxLeft)?metrics.actualBoundingBoxLeft:0,
  right:Number.isFinite(metrics.actualBoundingBoxRight)?metrics.actualBoundingBoxRight:metrics.width
 });
 let sBounds=bounds(sMetrics),aBounds=bounds(aMetrics);
 const gap=fontSize*.08,heartSize=fontSize*.44,maxLabelWidth=r*1.5;
 const labelWidth=sBounds.left+sBounds.right+aBounds.left+aBounds.right+heartSize+gap*2;
 if(labelWidth>maxLabelWidth){
  fontSize*=maxLabelWidth/labelWidth;ctx.font=`700 ${fontSize}px Montserrat,Arial,sans-serif`;
  sMetrics=ctx.measureText('S');aMetrics=ctx.measureText('A');sBounds=bounds(sMetrics);aBounds=bounds(aMetrics);
 }
 const scaledGap=fontSize*.08,scaledHeartSize=fontSize*.44;
 const scaledWidth=sBounds.left+sBounds.right+aBounds.left+aBounds.right+scaledHeartSize+scaledGap*2;
 const labelLeft=x-scaledWidth/2,centerY=y+r*.03;
 ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='rgba(78,52,140,.88)';
 ctx.fillText('S',labelLeft+sBounds.left,centerY);
 const heartX=labelLeft+sBounds.left+sBounds.right+scaledGap;
 const heartY=centerY-scaledHeartSize*.5;
 ctx.beginPath();ctx.moveTo(heartX+scaledHeartSize*.5,heartY+scaledHeartSize*.94);
 ctx.bezierCurveTo(heartX+scaledHeartSize*.4,heartY+scaledHeartSize*.82,heartX+scaledHeartSize*.08,heartY+scaledHeartSize*.59,heartX+scaledHeartSize*.08,heartY+scaledHeartSize*.34);
 ctx.bezierCurveTo(heartX+scaledHeartSize*.08,heartY+scaledHeartSize*.13,heartX+scaledHeartSize*.32,heartY+scaledHeartSize*.06,heartX+scaledHeartSize*.5,heartY+scaledHeartSize*.29);
 ctx.bezierCurveTo(heartX+scaledHeartSize*.68,heartY+scaledHeartSize*.06,heartX+scaledHeartSize*.92,heartY+scaledHeartSize*.13,heartX+scaledHeartSize*.92,heartY+scaledHeartSize*.34);
 ctx.bezierCurveTo(heartX+scaledHeartSize*.92,heartY+scaledHeartSize*.59,heartX+scaledHeartSize*.6,heartY+scaledHeartSize*.82,heartX+scaledHeartSize*.5,heartY+scaledHeartSize*.94);
 ctx.fill();
 const aLeft=heartX+scaledHeartSize+scaledGap;
 ctx.fillText('A',aLeft+aBounds.left,centerY);
 ctx.globalAlpha=1;
}
function earth(al,off){
 const cx=ecx,cy=ecy+off,r=Re;
 ctx.save();ctx.globalAlpha=al;
 let g=ctx.createRadialGradient(cx,cy,r*.96,cx,cy,r*1.14);g.addColorStop(0,'rgba(150,175,255,.6)');g.addColorStop(.4,'rgba(200,140,255,.2)');g.addColorStop(1,'rgba(120,90,255,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.14,0,7);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();
 const tw=r*4;
 for(const [img,sp] of [[tex,1],[cloud,1.7]]){const o=(tm*r*.012*sp)%tw;ctx.drawImage(img,cx-r-o,cy-r,tw,2*r);ctx.drawImage(img,cx-r-o+tw,cy-r,tw,2*r)}
 g=ctx.createRadialGradient(cx,cy-r*.9,r*.1,cx,cy-r*.9,r*2.1);g.addColorStop(0,'rgba(255,220,250,.3)');g.addColorStop(.5,'rgba(0,0,0,.15)');g.addColorStop(1,'rgba(2,3,18,.9)');
 ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r);ctx.restore();
 ctx.strokeStyle='rgba(210,200,255,.45)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();ctx.restore();
}
function draw(dt){
 const A=cl(T),B=cl(T-1),C=cl(T-2),eB=ease(B);
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
 // nebulosas
 const na=.14+.86*sm(B*1.3),M=Math.max(W,H);
 ctx.globalCompositeOperation='lighter';ctx.globalAlpha=na;
 for(const [x,y,r,c] of [[.2,.3,.6,'130,70,255,.3'],[.85,.2,.5,'255,90,170,.2'],[.5,.85,.7,'50,90,220,.28'],[.9,.75,.45,'200,80,230,.18']]){
  const g=ctx.createRadialGradient(W*x,H*y,0,W*x,H*y,M*r);g.addColorStop(0,`rgba(${c})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 // estrellas
 ctx.fillStyle='#fff';
 for(const s of stars){ctx.globalAlpha=(.25+.75*sm(B))*(.5+.5*Math.sin(tm*s.sp+s.ph));ctx.fillRect(s.x*W,s.y*H,s.r,s.r)}
 ctx.globalCompositeOperation='source-over';for(const f of fl)flyStep(f,dt);
 // cámara
 const sw=sm((B-.75)/.25),a=-Math.PI/2+.28*Math.sin(tm*.4)*sw;
 const mxp=ecx+rx*Math.cos(a),myp=ecy+ry*Math.sin(a);
 const ox=W/2+(mxp-W/2)*eB,oy=H/2+(myp-H/2)*eB;
 const glow=sm((T-.8)/.2)*(1-sm((T-1.45)/.5));
 const beat=1+(.012+.03*Math.pow(Math.max(0,Math.sin(tm*3.6)),8))*glow;
 let s=s0*Math.pow(fit/s0,ease(A));
 if(T<=0.001)s*=1+.015*Math.sin(tm*.6);
 s*=Math.pow(s2/fit,eB)*beat;
 // tierra y órbita
 ctx.globalCompositeOperation='source-over';
 const ea=sm((B-.35)/.5);
 if(ea>0){
  const oa=sm((B-.7)/.3);ctx.globalAlpha=.3*oa;ctx.strokeStyle='#ffb3dd';ctx.lineWidth=1.2;ctx.setLineDash([2,10]);ctx.lineDashOffset=-tm*6;
  ctx.beginPath();ctx.ellipse(ecx,ecy,rx,ry,0,0,7);ctx.stroke();ctx.setLineDash([]);
  earth(ea,(1-sm((B-.3)/.7))*Re*.9)}
 // resplandor del corazón
 if(glow>.01){ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(ox,oy,0,ox,oy,560*s);g.addColorStop(0,`rgba(255,100,190,${.38*glow})`);g.addColorStop(.5,`rgba(140,80,255,${.14*glow})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 // palabras
 ctx.font=`italic 500 10px ${F}`;ctx.textAlign='center';ctx.textBaseline='middle';
 const da=.55*(1-sm(T*1.05));
 if(da>.02){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=da;ctx.fillStyle='#b9a2ff';
  for(const d of decoys){const sx=ox+d.x*s,sy=oy+d.y*s;if(sx<-50||sx>W+50||sy<-20||sy>H+20)continue;const k=DPR*s*d.k;ctx.setTransform(k,0,0,k,DPR*sx,DPR*sy);ctx.fillText('Te amo',0,0)}}
 const m=sm((B-.55)/.4);
 ctx.globalCompositeOperation=B>0?'lighter':'source-over';ctx.globalAlpha=(1-.88*m)*.95;
 for(let i=0;i<N;i++){const w=words[i];let x,y,p=0,sc=s*w.k;
  if(B>0){p=ease((B-w.d)/.7);const r=w.r+(w.tr-w.r)*p,an=w.a+(w.ta-w.a)*p+Math.sin(Math.PI*p)*.9;x=r*Math.cos(an);y=r*Math.sin(an);sc*=1-.6*p}else{x=w.x;y=w.y}
  const sx=ox+x*s,sy=oy+y*s;if(sx<-60||sx>W+60||sy<-30||sy>H+30)continue;
  ctx.setTransform(DPR*sc,0,0,DPR*sc,DPR*sx,DPR*sy);
  ctx.fillStyle=(glow*1.25>w.t||p>.25)?w.c2:w.c1;ctx.fillText('Te amo',0,0)}
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;
 if(m>0)moon(ox,oy,Rm*(.75+.25*m),m);
 // partículas
 ctx.globalCompositeOperation='lighter';
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.y<-.02){q.y=1.02;q.x=Math.random()}if(q.x<0)q.x=1;if(q.x>1)q.x=0;
  ctx.globalAlpha=.6*(.5+.5*Math.sin(tm*1.3+q.ph))*(.4+.6*(1-C*.5));ctx.fillStyle=`rgb(${q.c})`;ctx.beginPath();ctx.arc(q.x*W,q.y*H,q.r,0,7);ctx.fill()}
 // estrellas fugaces
 if(T>2.3&&Math.random()<.006)shoot.push({x:Math.random()*W,y:-10,vx:-380-Math.random()*200,vy:240+Math.random()*120,l:1});
 for(let i=shoot.length-1;i>=0;i--){const q=shoot[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*.7;if(q.l<=0){shoot.splice(i,1);continue}
  const g=ctx.createLinearGradient(q.x,q.y,q.x-q.vx*.18,q.y-q.vy*.18);g.addColorStop(0,`rgba(255,230,250,${q.l})`);g.addColorStop(1,'rgba(255,150,220,0)');
  ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.18,q.y-q.vy*.18);ctx.stroke()}
 // viñeta
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,M*.8);v.addColorStop(0,'rgba(2,2,12,0)');v.addColorStop(1,'rgba(2,2,12,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
let shown=false;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
 if(T<target)T=Math.min(target,T+dt/DUR[Math.floor(T+1e-6)+1]);
 else if(T>target)T=Math.max(target,T-dt/DUR[Math.ceil(T-1e-6)]);
 draw(dt);
 const still=T===target;
 title.style.opacity=(T<.02&&target===0)?1:0;
 hint.textContent=HT[target];hint.classList.toggle('on',still&&target<3);
 const want=T>=2.45;
 if(want!==shown){shown=want;msg.classList.toggle('show',want);clearTimeout(againTO);again.classList.remove('on');if(want)againTO=setTimeout(()=>again.classList.add('on'),11000)}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// música sintetizada
let ac,mg,bus,on=false,tid,step=0,nt=0;
const CH=[[57,60,64,69,72,69,64,60],[53,57,60,65,69,65,60,57],[48,52,55,60,64,60,55,52],[55,59,62,67,71,67,62,59]];
const hz=m=>440*2**((m-69)/12);
function note(f,t,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.1)}
function sched(){while(nt<ac.currentTime+.6){const c=CH[(step>>3)%4],i=step%8;note(hz(c[i]),nt,2.2,.16,'triangle');if(i===0)[c[0]-12,c[1]-12,c[2]].forEach(m=>note(hz(m),nt,4.2,.07,'sine'));step++;nt+=.48}}
function initAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=0;mg.connect(ac.destination);
 bus=ac.createBiquadFilter();bus.type='lowpass';bus.frequency.value=2400;const d=ac.createDelay();d.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.4;
 bus.connect(mg);bus.connect(d);d.connect(fb);fb.connect(d);d.connect(mg)}
})();
